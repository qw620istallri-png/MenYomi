// ---------- window light: a shadow scene per tab behind a window frame; the slant follows the hour; at night the page dims and the window becomes a patch of moonlight
(function shade(){ const A=document.getElementById('sunA'), B=document.getElementById('sunB'); const xa=A.getContext('2d'), xb=B.getContext('2d'); const root=document.documentElement;
  const W=300,H=480; let KS=1; B.width=W; B.height=H;
  const fitRes=()=>{ const cw=A.getBoundingClientRect().width||innerWidth*.82; KS=clamp(cw/W/1.3,1,2.6)*Math.min(1.5,DPR>1?1.15:1); A.width=Math.round(W*KS); A.height=Math.round(H*KS);
    // which part of the canvas is actually on screen (the canvas overhangs the window and is tilted by CSS): undo the CSS matrix for each window corner
    const cw2=A.offsetWidth||1, ch2=A.offsetHeight||1, ol=A.offsetLeft, ot=A.offsetTop, vw=innerWidth, vh=innerHeight;
    VQ=[[0,0],[vw,0],[0,vh],[vw,vh]].map(([sx,sy])=>{ const X=sx-(ol+cw2), Y=sy-ot, lx=X/(.75-.0008*X), ly=Y*(1+.0008*lx)+.0625*lx; return [clamp((cw2+lx)*A.width/cw2,0,A.width), clamp(ly*A.height/ch2,0,A.height)]; }); };
  let VQ=null;
  fitRes(); addEventListener('resize',()=>{ clearTimeout(fitRes._t); fitRes._t=setTimeout(()=>{ fitRes(); if(reduce) frame(performance.now()); },300); });
